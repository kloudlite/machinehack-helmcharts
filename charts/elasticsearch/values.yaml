elasticsearch:
  global:
    kibanaEnabled: true

  # [source](https://github.com/bitnami/charts/tree/main/bitnami/elasticsearch#how-to-deploy-a-single-node)
  master:
    masterOnly: false
    replicaCount: 1
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0

  volumePermissions:
    enabled: true

  security:
    enabled: false
    # elasticPassword: {{ randAlphaNum 16 | b64enc }}
    tls:
      # AutoGenerate TLS certs for elastic
      autoGenerated: false

  kibana:
    resourcesPreset: medium
    elasticsearch:
      security:
        auth:
          enabled: false
          autoGenerated: false

ingress:
  enabled: false
  className: ""
  clusterIssuer: ""

  host: ""
  cors:
    enabled: false
    origins: []
